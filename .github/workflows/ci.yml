name: HTML Validation and Lint

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .

      - name: Lint HTML
        run: |
          npm install --save-dev htmlhint
          npx htmlhint "**/*.html"
